name: DLI validation (no deploy)

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main
      - 'feature/**'
  workflow_dispatch:

# This is intentionally a read-only validation workflow. No production
# environment, deployment key, database credentials or user data is used.
permissions:
  contents: read

concurrency:
  group: dli-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: TypeScript, source guards and browser bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CI: 'true'
    steps:
      - name: Check out repository without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js 22 with npm cache
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install exact locked dependencies
        run: npm ci

      - name: Verify production environment gate self-tests
        run: npm run check:release-env-tests

      - name: Verify browser-bundle scanner self-tests
        run: npm run check:bundle-scanner

      - name: Verify source-side AI compliance
        run: npm run check:ai-compliance

      - name: Verify reviewed migration file integrity
        run: npm run check:migration-integrity

      - name: Verify backup-receipt script self-tests (no backup files)
        run: npm run check:backup-file-tests

      - name: Verify Q4 offline recovery-bundle self-tests (synthetic files only)
        run: npm run check:recovery-bundle-tests

      - name: Verify document-backed paid learning rates remain finance-inactive
        run: npm run check:paid-learning-plans

      - name: Verify frontend role and student-tier matrix (no network)
        run: npm run check:role-matrix

      - name: Verify file-dialog focus preserves unsaved upload state
        run: npm run check:file-picker-focus

      - name: Verify Q5 production admission, edge origins and pinned release project
        run: npm run check:q5-release-safety

      - name: Verify Q5 offline recovery receipt creator with synthetic files
        run: npm run check:recovery-receipt-tests

      - name: Verify Cloudflare QA and production environment isolation
        run: npm run check:deployment-identity

      - name: Verify fresh-browser guest login remains accessible
        run: npm run check:guest-login

      - name: Verify guided Academic Structure and preserved catalogue controls
        run: npm run check:academic-hierarchy

      - name: Verify official DLI logo on all production surfaces
        run: npm run check:official-branding

      - name: Verify safe role and mobile UI production parity
        run: npm run check:q15-production-ui

      - name: Verify Q16 administrator-routed secure direct messaging
        run: npm run check:q16-admin-routed-chat


      - name: Verify verified user actions and accessible confirmation dialogs
        run: npm run check:q22-user-actions

      - name: Verify audited registry archive and restoration safety
        run: npm run check:q22-user-lifecycle

      - name: Verify safe CSV and calendar export generation
        run: npm run check:q22-operational-tools

      - name: Verify Q22 feature-by-feature production reconciliation
        run: npm run check:q22-feature-reconciliation

      - name: Verify Q23 manual bank transfer and private receipt review
        run: npm run check:q23-manual-payments

      - name: Verify two-party Tutor payouts and three equal admin finance roles
        run: npm run check:q24-tutor-payout

      - name: Verify Q25 privileged API hardening and operational transparency
        run: npm run check:q25-operational-hardening

      - name: Verify Q27 Academic Pro visual and accessibility contracts
        run: npm run check:q27-academic-pro

      - name: Verify Q28 reference UI, real data and role-safe dashboards
        run: npm run check:q28-reference-dashboard

      - name: Verify Q29 audited owner-admin paid plan settings
        run: npm run check:q29-editable-paid-plans

      - name: Verify Q30 immediately accessible finance plan edit controls
        run: npm run check:q30-finance-editor

      - name: Verify Q31 sidebar navigation layout and accessibility
        run: npm run check:q31-sidebar-navigation

      - name: Verify Q32 private chat-profile privacy and photo access
        run: npm run check:q32-chat-profiles

      - name: Verify Q33 unified Classes timetable and two-tutor academic assignments
        run: npm run check:q33-unified-classes

      - name: Verify Q34 cohort-pacing and Telegram message controls
        run: npm run check:q34-curriculum-telegram

      - name: Verify Q35 global compact workspaces, five roles, Free Student learning and protected Realtime
        run: npm run check:q35-global-focus-realtime

      - name: Verify Q36 new-chat filtering, single-row workspaces and shared background
        run: npm run check:q36-chat-focus-theme

      - name: Verify Q37 cross-workspace calling, media lifecycle and role-safe signal routing
        run: npm run check:q37-global-calling

      - name: Verify Q38 clean mobile classes workspace and learner-only guidance
        run: npm run check:q38-classes-mobile

      - name: Verify Q39 mobile messaging header and compact safeguarding disclosure
        run: npm run check:q39-messages-mobile

      - name: Verify Q40 first-login tour, mobile footnotes and secure Learning RLS
        run: npm run check:q40-tour-learning

      - name: Verify Q41 contextual guided feature spotlights and red-rim coverage
        run: npm run check:q41-feature-spotlights

      - name: Verify Q42 desktop sidebar collapse and focus overlay
        run: npm run check:q42-desktop-sidebar

      - name: Verify Q43 one identity per dashboard and role-safe navigation
        run: npm run check:q43-dashboard-identity

      - name: Verify Q44 complete focus scrolling and verified student photo selection
        run: npm run check:q44-focus-student-profile

      - name: Verify Q45 global shell, secure calls, floating inbox and role themes
        run: npm run check:q45-overhaul

      - name: Verify Q46 route deduplication, role matrix and narrow header structure
        run: npm run check:q46-release-structure

      - name: Verify Q47 protected executive names in chat directory and profile RPC migration
        run: npm run check:q47-executive-name-privacy

      - name: Verify Q48 responsive header structure and non-overlapping layout tracks
        run: npm run check:q48-header-overlap

      - name: Verify Q49 mobile call and overlay containment across viewports
        run: npm run check:q49-mobile-overlays

      - name: Verify Q50 production media authorizations and secure launch gating
        run: npm run check:q50-prod-realtimekit

      - name: Verify Q53 call ringtone, ringback and privacy lifecycle
        run: node scripts/verify-q53-foreground-ringtone.mjs

      - name: Verify Q54 recipient-confirmed ringing and private durable signal fallback
        run: node scripts/verify-q54-call-delivery.mjs

      - name: Verify Q52 Web Push source and privacy safety
        run: npm run check:q52-pwa-push

      - name: Verify Q58 guarded production notification rollout
        run: node scripts/verify-q58-production-push-gate.mjs

      - name: Verify Q60 sanitized Web Push diagnostics and housekeeping
        run: node scripts/verify-q60-push-housekeeping.mjs

      - name: Verify Q61 notification click navigation and deep links
        run: node scripts/verify-q61-notification-click.mjs

      - name: Verify Q62 Workbox offline, PWA manifest, badge and share contracts
        run: node scripts/verify-q62-native-pwa.mjs

      - name: Verify TypeScript
        run: npm run typecheck

      - name: Build and scan distributable browser files
        run: npm run build

      - name: Check that baseline Pages security headers are present
        run: |
          test -f dist/_headers
          grep -Fq 'X-Frame-Options: DENY' dist/_headers
          grep -Fq 'X-Content-Type-Options: nosniff' dist/_headers
          grep -Fq 'Referrer-Policy: no-referrer' dist/_headers

      - name: Assert unapproved production release remains blocked
        shell: bash
        run: |
          set -euo pipefail
          if npm run check:release-env > /tmp/dli-release-gate.log 2>&1; then
            echo "ERROR: unapproved production environment passed the release guard"
            exit 1
          fi
          if ! grep -Fq 'DLI K4 production configuration BLOCKED:' /tmp/dli-release-gate.log; then
            echo "ERROR: release gate failed for an unexpected reason"
            exit 1
          fi
          rm -f /tmp/dli-release-gate.log
          echo "Unapproved production release correctly blocked"

      - name: Confirm no deployment was requested
        run: echo "Read-only CI validation complete; no release/deployment step was run."
